# Simulation Benchmark Suite (Synthetic Experiments)
name: "simulation_benchmarks"
description: "Synthetic simulations highlighting higher-order and time-varying dependence beyond correlation"
output_dir: "results/simulation_benchmarks"
seed: 2026

analysis_config:
  experiment_type: "simulation_benchmarks"
  scenarios:
    - name: "multiplicative_triplet"
      n_samples: 6000
      noise_std: 0.25

    - name: "higher_order_only_switch"
      n_time_steps: 8
      n_samples_per_time: 3000

    - name: "dynamic_tail_df"
      n_time_steps: 24
      n_samples_per_time: 250
      n_variables: 5
      rho: 0.6
      nu_low: 3.0
      nu_high: 30.0
      schedule: "piecewise"

    - name: "tail_switch"
      n_time_steps: 24
      n_samples_per_time: 250
      n_variables: 5
      kendall_tau: 0.4

    - name: "hub_switch"
      n_time_steps: 24
      n_samples_per_time: 250
      n_variables: 8
      hub_a: 0
      hub_b: 1
      rho_hub: 0.7

    - name: "agent_interaction_episodes"
      n_time_steps: 28
      n_samples_per_time: 300
      n_agents: 6
      rho_pairwise: 0.7
      rho_higher: 0.5
      nu_higher: 3.0

plot_config:
  create_plots: true
