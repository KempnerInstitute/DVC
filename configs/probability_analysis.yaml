# Probability Analysis Experiment Configuration
name: "probability_analysis_multivariate"
description: "Comprehensive probability analysis of multivariate vine copulas"
output_dir: "results/probability_analysis"
seed: 42

# Data generation configuration
data_config:
  type: "synthetic"  # Options: synthetic, file
  n_samples: 2000
  n_variables: 4
  correlation_type: "moderate"  # Options: moderate, block, independent

# Vine copula configuration
vine_config:
  types:
    - "c-vine"
    - "d-vine"
    - "r-vine"
  families:
    - "independence"
    - "gaussian"
    - "student"
    - "clayton"
    - "frank"
    - "gumbel"
    - "joe"

# Analysis configuration
analysis_config:
  experiment_type: "probability_analysis"
  compute_information_measures: true
  
# Plotting configuration
plot_config:
  create_plots: true
  plot_style: "seaborn"
