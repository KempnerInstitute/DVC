# Comprehensive Comparison Experiment Configuration
name: "comprehensive_vine_comparison"
description: "Comprehensive comparison of vine types, copula families, and time-dependent modeling"
output_dir: "results/comprehensive_comparison"
seed: 789

# Data generation configuration
data_config:
  type: "synthetic"
  n_samples: 3000
  n_variables: 5
  correlation_type: "block"  # Create block-structured dependencies

# Vine copula configuration
vine_config:
  types:
    - "c-vine"
    - "d-vine"
    - "r-vine"
  families:
    - "independence"
    - "gaussian"
    - "student"
    - "clayton"
    - "frank"
    - "gumbel"
  structure_optimization: "tau"  # Use Kendall's tau for R-vine structure selection

# Time-dependent configuration (for comparison)
time_config:
  n_time_steps: 50
  n_samples_per_time: 150
  n_variables: 5
  correlation_evolution: "piecewise"
  hidden_dim: 128

# Analysis configuration
analysis_config:
  experiment_type: "probability_analysis"  # Start with probability analysis
  compute_information_measures: true
  compare_vine_types: true
  evaluate_copula_families: true
  assess_correlation_preservation: true
  
# Benchmarking configuration
benchmark_config:
  run_benchmarks: true
  compare_with_tensorflow: false  # Set to true if TF reference available
  performance_metrics:
    - "fitting_time"
    - "sampling_time"
    - "correlation_error"
    - "log_likelihood"
    
# Plotting configuration
plot_config:
  create_plots: true
  plot_style: "seaborn"
  create_comparison_plots: true
  save_format: "png"
  dpi: 300
