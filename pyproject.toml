[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dynamic-vine-copulas"
version = "0.1.0"
description = "Vine copula modeling and temporal dependence diagnostics"
authors = ["DVC contributors"]
license = "MIT"
readme = "README.md"
keywords = ["vine-copula", "copula", "multivariate-statistics", "dependence-modeling", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

packages = [{include = "dvc_package", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.10.0"
pandas = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.13.0"
pyyaml = "^6.0"
hydra-core = "^1.3.0"
click = "^8.0.0"
tqdm = "^4.65.0"
scikit-learn = "^1.3.0"
h5py = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
sphinx = "^7.1.0"
sphinx-rtd-theme = "^1.3.0"
jupyter = "^1.0.0"
pre-commit = "^3.4.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"

[tool.poetry.scripts]
dvc-fit = "dvc_package.cli.main:fit_vine_cli"
dvc-entropy = "dvc_package.cli.main:estimate_entropy_cli"
dvc-time = "dvc_package.cli.main:time_model_cli"
dvc-experiment = "dvc_package.cli.main:run_experiment_cli"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["dvc_package"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "pandas.*",
    "sklearn.*",
]
ignore_missing_imports = true
