# Conda environment file for DVC (Dynamic Vine Copula) project
name: dvc-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  
  # PyTorch ecosystem
  - pytorch>=1.12.0
  - torchvision
  - torchaudio
  
  # Scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - scikit-learn>=1.0.0
  
  # Plotting and visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  
  # Configuration and I/O
  - pyyaml
  
  # Development and analysis
  - jupyter
  - notebook
  - ipykernel
  
  # Statistical analysis
  - statsmodels
  
  # Utilities
  - tqdm
  
  # Pip dependencies
  - pip
  - pip:
    - tensorboard
    - rich
    - plotly>=5.0.0
    - kaleido
    - optuna
    - memory-profiler
    - mkdocs>=1.5.0
